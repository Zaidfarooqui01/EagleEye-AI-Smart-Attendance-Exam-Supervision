version: '3.8'

# Production Docker Compose configuration for Eagle Eye
# Use: docker-compose -f docker-compose.prod.yml up -d

services:
  eagleeye:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: eagleeye-prod
    restart: always
    
    # Production port mapping
    ports:
      - "5000:5000"
    
    # Named volumes for persistent data (recommended for production)
    volumes:
      - eagleeye-data:/app/data
      - eagleeye-outputs:/app/outputs
      - eagleeye-logs:/app/logs
    
    # Device access for hardware
    devices:
      - /dev/video0:/dev/video0
      - /dev/snd:/dev/snd
    
    # Environment variables
    env_file:
      - .env
    environment:
      - FLASK_APP=app.dashboard
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    
    # Resource constraints
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    
    # Security options
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
    
    networks:
      - eagleeye-prod-network
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=eagleeye"

  # Optional: Reverse proxy with Nginx
  nginx:
    image: nginx:alpine
    container_name: eagleeye-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - eagleeye
    networks:
      - eagleeye-prod-network

volumes:
  eagleeye-data:
    driver: local
  eagleeye-outputs:
    driver: local
  eagleeye-logs:
    driver: local

networks:
  eagleeye-prod-network:
    driver: bridge
