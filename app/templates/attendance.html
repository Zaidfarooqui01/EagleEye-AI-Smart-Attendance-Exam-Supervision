<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Attendance — EagleEye</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0f1a;
            --bg2: #111827;
            --border: rgba(255,255,255,0.08);
            --accent: #6366f1;
            --green: #10b981;
            --red: #f43f5e;
            --text: #f1f5f9;
            --muted: #94a3b8;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .topbar {
            height: 60px;
            background: rgba(17,24,39,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center;
            padding: 0 24px; gap: 16px;
            position: sticky; top: 0; z-index: 100;
        }
        .topbar-logo {
            display: flex; align-items: center; gap: 10px;
            font-size: 1rem; font-weight: 700;
            color: var(--text); text-decoration: none;
        }
        .logo-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--green), #059669);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem;
        }
        .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
        .btn-back {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            color: var(--muted); padding: 6px 14px; border-radius: 8px;
            cursor: pointer; font-size: 0.8rem; font-family: 'Inter', sans-serif;
            text-decoration: none; display: flex; align-items: center; gap: 6px;
            transition: all 0.2s;
        }
        .btn-back:hover { color: var(--text); }
        .status-pill {
            display: flex; align-items: center; gap: 7px;
            padding: 6px 14px; border-radius: 20px;
            font-size: 0.78rem; font-weight: 600; border: 1px solid;
        }
        .status-pill.online {
            background: rgba(16,185,129,0.1);
            border-color: rgba(16,185,129,0.3); color: var(--green);
        }
        .status-pill.offline {
            background: rgba(100,116,139,0.1);
            border-color: #334155; color: var(--muted);
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .status-pill.online .status-dot { animation: pulse 2s infinite; }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); }
            50% { box-shadow: 0 0 0 5px rgba(16,185,129,0); }
        }

        .page-content { display: grid; grid-template-columns: 1fr 380px; gap: 24px; padding: 24px; max-width: 1400px; margin: 0 auto; }
        @media (max-width: 900px) { .page-content { grid-template-columns: 1fr; } }

        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden;
        }
        .card-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .card-header h2 {
            font-size: 0.95rem; font-weight: 700;
            display: flex; align-items: center; gap: 8px;
        }
        .card-header h2 i { color: var(--green); }

        /* Video */
        .video-wrapper {
            position: relative;
            background: #040709;
        }
        .video-wrapper img {
            width: 100%; display: block;
            min-height: 300px; object-fit: cover;
        }
        .video-placeholder {
            min-height: 350px; display: flex;
            align-items: center; justify-content: center;
            flex-direction: column; gap: 12px;
            color: var(--muted);
        }
        .video-placeholder i { font-size: 2rem; }
        .video-placeholder p { font-size: 0.82rem; }

        /* Log panel */
        .stats-row {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 0; border-bottom: 1px solid var(--border);
        }
        .stat-cell {
            padding: 16px; text-align: center;
            border-right: 1px solid var(--border);
        }
        .stat-cell:last-child { border-right: none; }
        .stat-val {
            font-size: 1.6rem; font-weight: 800;
            color: var(--green);
        }
        .stat-label { font-size: 0.68rem; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }

        .attendance-log {
            max-height: 450px; overflow-y: auto;
            padding: 12px 16px;
        }
        .attendance-log::-webkit-scrollbar { width: 3px; }
        .attendance-log::-webkit-scrollbar-thumb { background: #1e293b; }

        .log-empty {
            text-align: center; padding: 40px 16px;
            color: #475569; font-size: 0.82rem;
        }
        .log-empty i { display: block; font-size: 1.5rem; margin-bottom: 8px; }

        .log-item {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 4px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { opacity:0; transform: translateX(10px); }
            to { opacity:1; transform: translateX(0); }
        }
        .log-item:last-child { border-bottom: none; }
        .log-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; font-weight: 700; color: white;
            flex-shrink: 0;
        }
        .log-info { flex: 1; min-width: 0; }
        .log-name { font-size: 0.88rem; font-weight: 600; }
        .log-roll { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
        .log-meta { text-align: right; flex-shrink: 0; }
        .log-time { font-size: 0.75rem; color: var(--muted); }
        .log-badge {
            font-size: 0.65rem; padding: 2px 8px; border-radius: 8px;
            font-weight: 700; display: block; margin-top: 3px;
        }
        .log-badge.present {
            background: rgba(16,185,129,0.15); color: var(--green);
        }
    </style>
</head>
<body>
<nav class="topbar">
    <a href="{{ url_for('hub') }}" class="topbar-logo">
        <div class="logo-icon">✅</div>
        EagleEye — Daily Attendance
    </a>
    <div class="topbar-right">
        <div class="status-pill offline" id="conn-status">
            <span class="status-dot"></span>
            <span id="conn-text">Connecting...</span>
        </div>
        <a href="{{ url_for('hub') }}" class="btn-back">
            <i class="fas fa-arrow-left"></i> Hub
        </a>
    </div>
</nav>

<div class="page-content">
    <!-- Video Feed -->
    <div class="card">
        <div class="card-header">
            <h2><i class="fas fa-camera"></i> Live Face Recognition</h2>
        </div>
        <div class="video-wrapper" id="video-wrapper">
            <div class="video-placeholder" id="video-placeholder">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Initializing camera...</p>
            </div>
            <img id="video-feed" style="display:none;" alt="Live attendance feed">
        </div>
    </div>

    <!-- Attendance Log -->
    <div class="card">
        <div class="stats-row">
            <div class="stat-cell">
                <div class="stat-val" id="count-present">0</div>
                <div class="stat-label">Present</div>
            </div>
            <div class="stat-cell">
                <div class="stat-val" id="count-total">—</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat-cell">
                <div class="stat-val" id="count-pct" style="color:var(--accent);">—%</div>
                <div class="stat-label">Rate</div>
            </div>
        </div>
        <div class="card-header" style="border-top: 1px solid var(--border);">
            <h2><i class="fas fa-list-check"></i> Today's Attendance Log
                — <span id="today-date" style="font-weight:400; color:var(--muted); font-size:0.8rem;"></span>
            </h2>
        </div>
        <div class="attendance-log" id="attendance-log">
            <div class="log-empty">
                <i class="fas fa-user-clock"></i>
                Awaiting face scans...
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const socket = io('/attendance');
    const videoFeed   = document.getElementById('video-feed');
    const placeholder = document.getElementById('video-placeholder');
    const connStatus  = document.getElementById('conn-status');
    const connText    = document.getElementById('conn-text');
    const logEl       = document.getElementById('attendance-log');
    const countEl     = document.getElementById('count-present');

    let presentCount = 0;
    let firstFrame = true;

    document.getElementById('today-date').textContent =
        new Date().toLocaleDateString('en-US', {weekday:'long', year:'numeric', month:'long', day:'numeric'});

    socket.on('connect', () => {
        connStatus.className = 'status-pill online';
        connText.textContent = 'Camera Active';
    });
    socket.on('disconnect', () => {
        connStatus.className = 'status-pill offline';
        connText.textContent = 'Disconnected';
    });

    socket.on('video_frame', (data) => {
        if (firstFrame) {
            placeholder.style.display = 'none';
            videoFeed.style.display = 'block';
            firstFrame = false;
        }
        videoFeed.src = `data:image/jpeg;base64,${data.image}`;
    });

    socket.on('attendance_update', (data) => {
        const empty = logEl.querySelector('.log-empty');
        if (empty) empty.remove();

        presentCount++;
        countEl.textContent = presentCount;

        const initials = data.name ? data.name.split(' ').map(w => w[0]).join('').substring(0,2).toUpperCase() : '?';

        const item = document.createElement('div');
        item.className = 'log-item';
        item.innerHTML = `
            <div class="log-avatar">${initials}</div>
            <div class="log-info">
                <div class="log-name">${data.name || 'Unknown'}</div>
                <div class="log-roll">${data.roll_number || ''}</div>
            </div>
            <div class="log-meta">
                <div class="log-time">${data.timestamp}</div>
                <span class="log-badge present">Present</span>
            </div>
        `;
        logEl.prepend(item);
    });

    socket.on('attendance_error', (data) => {
        placeholder.innerHTML = `<i class="fas fa-camera-slash" style="color:var(--red);"></i><p style="color:var(--red);">${data.message}</p>`;
        placeholder.style.display = 'flex';
        videoFeed.style.display = 'none';
    });
});
</script>
</body>
</html>
